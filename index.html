<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strom-Werkstatt DS 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: eine Seite = ein Bildschirm (iPad 11 Zoll quer). Kopfleiste mit Seitenpunkten, Seitenkopf in Typfarbe, darunter zwei oder drei Spalten.
     Farben tragen Bedeutung: Seitentyp (Input, Challenge, Versuch) und Größe (U blau, I rot, Q grün). */
  --bg:#e8ecf1; --surface:#ffffff; --sunk:#f2f4f7; --ink:#14202c; --muted:#566373; --line:#cdd5de;
  --in:#0b7f86; --in-bg:#dcf1f2; --ch:#c65a00; --ch-bg:#ffe9d2; --ex:#6b3fc4; --ex-bg:#ebe3fb;
  --u:#1a62d6; --u-bg:#deeaff; --i:#d0263a; --i-bg:#ffe1e4; --q:#17803f; --q-bg:#dcf3e3;
  --good:#17783f; --good-bg:#e0f4e7; --bad:#b3261e; --bad-bg:#fbe5e3; --warn:#8f5400; --warn-bg:#fff0d2;
  --lcd:#c7d3b4; --lcd-ink:#1d261a; --glow:#ffc62e;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f151c; --surface:#19222d; --sunk:#131b24; --ink:#e9eef4; --muted:#9ba8b7; --line:#34414f;
    --in:#4fd0d6; --in-bg:#0f3336; --ch:#ffa04d; --ch-bg:#3f2408; --ex:#b79bff; --ex-bg:#2a1f47;
    --u:#74aaff; --u-bg:#14294a; --i:#ff7482; --i-bg:#451920; --q:#63d892; --q-bg:#123522;
    --good:#6fdc9a; --good-bg:#143524; --bad:#ff9a92; --bad-bg:#3d1a18; --warn:#ffc46b; --warn-bg:#3a2a0c;
    --lcd:#aebb9b; --lcd-ink:#141b12; --glow:#ffd45e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f151c; --surface:#19222d; --sunk:#131b24; --ink:#e9eef4; --muted:#9ba8b7; --line:#34414f;
  --in:#4fd0d6; --in-bg:#0f3336; --ch:#ffa04d; --ch-bg:#3f2408; --ex:#b79bff; --ex-bg:#2a1f47;
  --u:#74aaff; --u-bg:#14294a; --i:#ff7482; --i-bg:#451920; --q:#63d892; --q-bg:#123522;
  --good:#6fdc9a; --good-bg:#143524; --bad:#ff9a92; --bad-bg:#3d1a18; --warn:#ffc46b; --warn-bg:#3a2a0c;
  --lcd:#aebb9b; --lcd-ink:#141b12; --glow:#ffd45e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-size:1.2rem;font-weight:800}
h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--surface);border-bottom:2px solid var(--ink)}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.dots a{width:26px;height:26px;border-radius:6px;border:2px solid var(--tc);background:var(--tb);color:var(--tc);font-family:var(--f-mono);font-size:.75rem;display:flex;align-items:center;justify-content:center;text-decoration:none}
.dots a.done{background:var(--tc);color:var(--surface)}
.dots a[aria-current="page"]{outline:3px solid var(--ink);outline-offset:1px}
.t-in{--tc:var(--in);--tb:var(--in-bg)} .t-ch{--tc:var(--ch);--tb:var(--ch-bg)} .t-ex{--tc:var(--ex);--tb:var(--ex-bg)}
main{flex:1;min-height:0;overflow:auto;padding:14px 18px}
.page{display:none;flex-direction:column;gap:12px;min-height:100%;max-width:1240px;margin:0 auto}
.page.on{display:flex}
.phead{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:10px;background:var(--tb);border-left:10px solid var(--tc)}
.phead .tag{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;background:var(--tc);color:var(--surface);padding:3px 10px;border-radius:999px}
.phead h2{flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;align-items:start}
.cols3{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;flex:1;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px;background:var(--surface);border-top:1px solid var(--line)}
.foot span{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
button{font:inherit;min-height:44px;padding:6px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--surface);font-weight:700}
button.check{background:var(--ch);border-color:var(--ch);color:var(--surface);font-weight:700}
button.sel{background:var(--ink);color:var(--surface)}
button.small{min-height:36px;padding:2px 10px;font-size:.9rem}
button.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
button.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--u);outline-offset:2px}
input[type=text]{font:inherit;font-family:var(--f-mono);min-height:44px;width:7.5em;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink)}
input.wide{width:100%;font-family:var(--f-body)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--u);min-height:36px}
.fb{padding:8px 12px;border-radius:8px;border-left:6px solid var(--line);background:var(--sunk);font-size:.95rem}
.fb.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.fb.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.fb:empty{display:none}
.merk{border:2px solid var(--in);background:var(--in-bg);border-radius:10px;padding:10px 14px}
.merk b:first-child{font-family:var(--f-display);color:var(--in)}
.U{color:var(--u);font-weight:700} .I{color:var(--i);font-weight:700} .Q{color:var(--q);font-weight:700}
.chipU,.chipI,.chipQ{font-family:var(--f-mono);padding:1px 8px;border-radius:6px;font-weight:700}
.chipU{background:var(--u-bg);color:var(--u)} .chipI{background:var(--i-bg);color:var(--i)} .chipQ{background:var(--q-bg);color:var(--q)}
.lvl{font-family:var(--f-mono);font-size:.8rem;padding:1px 8px;border-radius:999px;border:1.5px solid var(--ch);color:var(--ch)}
.lvl.bonus{border-color:var(--ex);color:var(--ex)}
.formula{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;align-items:center}
.frac span:first-child{border-bottom:4px solid var(--ink);padding:0 10px 2px}
ol,ul{margin:0;padding-left:1.25em}
li+li{margin-top:3px}
svg{max-width:100%;display:block}
.sch{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sch-t{fill:var(--ink);stroke:none;font-family:var(--f-mono);font-size:14px}
.lit{fill:var(--glow)}
.tap{fill:transparent;cursor:pointer}
.flow{stroke:var(--i);stroke-width:5;fill:none;stroke-dasharray:4 14;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
.lcd{font-family:var(--f-mono);background:var(--lcd);color:var(--lcd-ink);border-radius:6px;padding:2px 12px;font-size:1.4rem;text-align:right;border:2px solid var(--ink);min-width:5em}
.pill{font-family:var(--f-mono);font-size:.85rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
th{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:400}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)}
.mini svg{height:132px;margin:0 auto}
.mini .why{font-size:.8rem;min-height:2.3em}
.mini.r{border-color:var(--good);background:var(--good-bg)} .mini.w{border-color:var(--bad);background:var(--bad-bg)}
.symcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;font-size:.95rem;text-align:center;overflow-wrap:anywhere}
.badge{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.8rem;background:var(--ex);color:var(--surface);margin-right:6px}
.pairbtn{text-align:left;width:100%;min-height:40px;padding:4px 10px}
.blank{border-style:dashed;min-width:8em;font-weight:700}
.big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.xp{cursor:pointer;position:relative}
.xp.cov{border-style:dashed;border-color:var(--in);background:var(--sunk);color:transparent}
.xp.cov>*{visibility:hidden}
.xp.cov::after{content:"Tippen zum Einblenden";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.9rem;color:var(--in)}
.muted{color:var(--muted)} .sm{font-size:.9rem}
@media (max-width:820px){.cols,.cols3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><h1>Strom-Werkstatt</h1><nav class="dots" id="dots" aria-label="Seiten"></nav><button class="small" id="theme">Dunkel</button></header>
  <main id="main"></main>
  <footer class="foot"><button id="prev">Zurück</button><span id="pos"></span><button class="primary" id="next">Weiter</button></footer>
</div>
<script>
(function(){
"use strict";
var KEY="stromwerkstatt-ds1-v2";
var S={verdeckt:true,q:{},verm:"",leu:{},leuChk:false,match:[],bk:{task:0,done:[],slots:{}},wp:{},wpChk:false,count:null,iOk:false,gap:[0,0],gapOk:false,ord:[],ordOk:false,mm:0,v:{},vOk:false,vqOk:false,ex:{},theme:""};
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d)for(var k in d)S[k]=d[k];}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}marks();}
function $(id){return document.getElementById(id);}
function num(s){var x=parseFloat(String(s).replace(",",".").replace(/\s/g,""));return isNaN(x)?null:x;}
function fmt(x,d){return x.toFixed(d).replace(".",",");}
function fb(el,cls,txt){el.className="fb "+cls;el.textContent=txt;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ---------- Schaltzeichen ---------- */
function sym(t,x,y,rot,o){
  o=o||{};rot=rot||0;var g='<g transform="translate('+x+','+y+') rotate('+rot+')" class="sch">';
  if(t==="wire")g+='<path d="M-30 0H30"/>';
  else if(t==="gap")g+='<path d="M-30 0H-12M12 0H30"/><circle cx="-12" cy="0" r="2.5"/><circle cx="12" cy="0" r="2.5"/>';
  else if(t==="source")g+='<path d="M-30 0H-5M-5 -14V14M5 0H30"/><path d="M5 -7V7" stroke-width="5"/><text class="sch-t" x="-18" y="-9" text-anchor="middle" transform="rotate('+(-rot)+' -18 -13)">+</text>';
  else if(t==="lamp")g+='<path d="M-30 0H-13M13 0H30"/><circle cx="0" cy="0" r="13"'+(o.lit?' class="lit" stroke="var(--ink)"':'')+'/><path d="M-9 -9L9 9M-9 9L9 -9"/>';
  else if(t==="swOpen")g+='<path d="M-30 0H-12M-12 0L10 -13M12 0H30"/><circle cx="-12" cy="0" r="2.5"/><circle cx="12" cy="0" r="2.5"/>';
  else if(t==="swClosed")g+='<path d="M-30 0H30"/><circle cx="-12" cy="0" r="3.5" fill="var(--ink)"/><circle cx="12" cy="0" r="3.5" fill="var(--ink)"/>';
  else if(t==="res")g+='<path d="M-30 0H-16M16 0H30"/><rect x="-16" y="-7" width="32" height="14"/>';
  else if(t==="A"||t==="V"){var c=t==="A"?"var(--i)":"var(--u)";g+='<path d="M-30 0H-13M13 0H30"/><circle cx="0" cy="0" r="13" fill="var(--surface)" stroke="'+c+'"/><text x="0" y="5" text-anchor="middle" font-size="16" font-family="Share Tech Mono, monospace" fill="'+c+'" stroke="none" transform="rotate('+(-rot)+')">'+t+'</text>';}
  return g+'</g>';
}
function P(d,c){return '<path class="'+(c||"sch")+'" d="'+d+'"/>';}
function dot(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--ink)"/>';}

/* ---------- Auswahlfrage ---------- */
function quiz(el,key,q,opts,correct,explain,noSolve){
  var h='<p><b>'+q+'</b></p><div class="row">';
  opts.forEach(function(o,i){h+='<button data-i="'+i+'">'+o+'</button>';});
  h+='</div><div class="fb"></div>';el.innerHTML=h;
  var bs=el.querySelectorAll("button"),f=el.querySelector(".fb");
  function show(){var a=S.q[key];if(a==null)return;
    bs.forEach(function(b,i){b.classList.toggle("sel",i===a);});
    if(noSolve)fb(f,"","Gespeichert. "+explain);
    else if(a===correct)fb(f,"ok","Richtig. "+explain);else fb(f,"no","Noch nicht. Überlege noch einmal.");}
  bs.forEach(function(b){b.onclick=function(){S.q[key]=+b.dataset.i;save();show();};});
  show();
}

/* ---------- Kreislauf-Modell (Canvas) ---------- */
var MODELS=[],G={x0:200,y0:100,w:880,h:320},NDOT=60,QDOT=0.02,RLAMP=120;
function Model(cv,cfg){
  var m={U:cfg.U==null?6:cfg.U,on:cfg.on!==false,mode:"el",off:0,last:0,raf:0,gates:!!cfg.gates,counting:false,t0:0,c0:0,tick:null,doneCb:null};
  cv.width=1280;cv.height=520;
  var per=2*(G.w+G.h),d=per/NDOT;
  function pt(s){var w=G.w,h=G.h;s=((s%per)+per)%per;
    if(s<w)return [G.x0+s,G.y0+h];if(s<w+h)return [G.x0+w,G.y0+h-(s-w)];
    if(s<2*w+h)return [G.x0+w-(s-w-h),G.y0];return [G.x0,G.y0+(s-2*w-h)];}
  function draw(ts){
    m.raf=requestAnimationFrame(draw);
    var dt=Math.min(.05,(ts-m.last)/1000||0);m.last=ts;
    var U=m.on?m.U:0,I=U/RLAMP;m.off+=I/QDOT*d*dt;
    var c=cv.getContext("2d"),ink=css("--ink"),wa=m.mode==="wa";
    c.clearRect(0,0,1280,520);
    c.lineWidth=wa?34:8;c.strokeStyle=wa?css("--line"):ink;c.lineJoin="round";c.strokeRect(G.x0,G.y0,G.w,G.h);
    c.fillStyle=wa?css("--u"):css("--q");
    for(var i=0;i<NDOT;i++){var p=pt(i*d+m.off);c.beginPath();c.arc(p[0],p[1],wa?9:11,0,7);c.fill();}
    c.fillStyle=css("--surface");c.strokeStyle=css("--u");c.lineWidth=6;
    c.fillRect(G.x0-75,G.y0+G.h/2-80,150,160);c.strokeRect(G.x0-75,G.y0+G.h/2-80,150,160);
    c.fillStyle=css("--u");c.font="34px 'Share Tech Mono',monospace";c.textAlign="center";
    c.fillText(wa?"Pumpe":"Quelle",G.x0,G.y0+G.h/2+10);
    if(!wa){c.fillStyle=ink;c.fillText("+",G.x0,G.y0+G.h/2-44);c.fillText("−",G.x0,G.y0+G.h/2+62);}
    var b=Math.pow(U/12,2),lx=G.x0+G.w,ly=G.y0+G.h/2;
    if(!wa&&b>0){c.globalAlpha=b*.5;c.fillStyle=css("--glow");c.beginPath();c.arc(lx,ly,110,0,7);c.fill();c.globalAlpha=1;}
    c.fillStyle=css("--surface");c.beginPath();c.arc(lx,ly,62,0,7);c.fill();
    if(!wa){c.globalAlpha=Math.min(1,b);c.fillStyle=css("--glow");c.beginPath();c.arc(lx,ly,62,0,7);c.fill();c.globalAlpha=1;}
    c.strokeStyle=ink;c.lineWidth=5;c.beginPath();c.arc(lx,ly,62,0,7);c.stroke();
    if(wa){c.save();c.translate(lx,ly);c.rotate(-m.off/60);for(var k=0;k<6;k++){c.rotate(Math.PI/3);c.beginPath();c.moveTo(0,0);c.lineTo(56,0);c.stroke();}c.restore();}
    else{c.beginPath();c.moveTo(lx-44,ly-44);c.lineTo(lx+44,ly+44);c.moveTo(lx-44,ly+44);c.lineTo(lx+44,ly-44);c.stroke();}
    c.fillStyle=ink;c.textAlign="left";c.fillText(wa?"Wasserrad":"Lampe",lx+78,ly+10);
    c.textAlign="center";c.font="28px 'Share Tech Mono',monospace";c.fillStyle=css("--muted");
    c.fillText(!m.on?"Schalter offen: nichts bewegt sich":(wa?"Wasser strömt im Kreis":"Elektronen wandern von − nach +"),G.x0+G.w/2,G.y0+G.h/2+10);
    if(m.gates){var gx=G.x0+520;c.strokeStyle=css("--i");c.lineWidth=6;c.setLineDash([12,8]);
      c.beginPath();c.moveTo(gx,G.y0-44);c.lineTo(gx,G.y0+44);c.moveTo(gx,G.y0+G.h-44);c.lineTo(gx,G.y0+G.h+44);c.stroke();c.setLineDash([]);
      c.fillStyle=css("--i");c.font="34px 'Share Tech Mono',monospace";c.fillText("Tor A",gx,G.y0-56);c.fillText("Tor B",gx,G.y0+G.h+84);}
    if(m.counting){var t=(ts-m.t0)/1000,n=Math.floor(m.off/d)-m.c0;if(t>=10){t=10;m.counting=false;if(m.doneCb)m.doneCb(n);}if(m.tick)m.tick(n,t);}
  }
  m.start=function(){cancelAnimationFrame(m.raf);m.last=performance.now();m.raf=requestAnimationFrame(draw);};
  m.stop=function(){cancelAnimationFrame(m.raf);};
  m.count=function(){m.counting=true;m.t0=performance.now();m.c0=Math.floor(m.off/d);};
  MODELS.push(m);return m;
}

/* ---------- Multimeter und Messschaltung ---------- */
var DIAL=["OFF","V DC","V AC","Ω","mA","10A"],SOCK=["10A","mA","COM","VΩ"];
function mmSvg(D,disp){
  var h='<rect x="6" y="6" width="228" height="388" rx="22" fill="var(--sunk)" stroke="var(--ink)" stroke-width="3"/>';
  h+='<rect x="26" y="26" width="188" height="62" rx="6" fill="var(--lcd)" stroke="var(--ink)" stroke-width="2"/>';
  h+='<text x="204" y="70" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="34" fill="var(--lcd-ink)">'+(disp!=null?disp:(D.dial==="OFF"?"":"0.00"))+'</text>';
  var cx=120,cy=200;h+='<circle cx="'+cx+'" cy="'+cy+'" r="46" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>';
  DIAL.forEach(function(n,i){var a=(-90+i*60)*Math.PI/180,x=cx+84*Math.cos(a),y=cy+84*Math.sin(a),on=D.dial===n;

'<div class="col"><div class="card"><p><span class="lvl">Pflicht</span> Jeder Punkt ist ein <span class="Q">Ladungspaket von 0,02 C</span>. Stelle eine Spannung ein, zähle 10 s lang und berechne die Stromstärke.</p><div class="fb" id="cfb"></div><div class="row"><label for="iIn"><b class="I">I =</b></label><input id="iIn" type="text" inputmode="decimal"><span>mA</span><button class="check" id="iChk">Prüfen</button></div><div class="fb" id="ifb"></div></div>'+

function(){var m=Model($("cv11"),{U:6,gates:true});this.model=m;
  m.tick=function(n,t){$("cA").textContent="Tor A: "+n;$("cB").textContent="Tor B: "+n;$("cT").textContent="t = "+t.toFixed(1)+" s";};
  m.doneCb=function(n){$("cnt").disabled=false;S.count={n:n};S.iOk=false;save();res();};

  $("iChk").onclick=function(){var x=num($("iIn").value);if(!S.count){fb($("ifb"),"warn","Zähle zuerst 10 Sekunden lang.");return;}if(x==null){fb($("ifb"),"warn","Gib eine Zahl ein.");return;}

 {t:"Auftrag 1: Spannung messen",d:"Miss die Spannung an der Lampe.",dial:"V DC",red:"VΩ",con:"par"},
 {t:"Auftrag 2: Stromstärke messen",d:"Miss die Stromstärke durch die Lampe. Du kennst den Wert noch nicht.",dial:"10A",red:"10A",con:"ser"},

];
var D={dial:"OFF",red:null,blk:null,con:null,lead:"red",on:false,res:null};
function evalMM(){
  var r=D.red,b=D.blk,dl=D.dial,par=D.con==="par";
  if(!D.con)return {pre:1,msg:"Wähle erst den Anschluss: parallel oder in Reihe."};
  if(!r||!b)return {pre:1,msg:"Es fehlen noch Leitungen. Ein Messgerät braucht zwei Anschlüsse."};
  if(b!=="COM"||r==="COM")return {disp:"----",lamp:par,cls:"no",msg:"Die schwarze Leitung gehört immer in COM, die rote in die Messbuchse."};
  if(dl==="OFF")return {disp:"",lamp:par||r!=="VΩ",cls:"warn",msg:"Das Multimeter ist ausgeschaltet. Stelle den Drehschalter."};
  var volt=r==="VΩ";
  if(par){
    if(!volt)return {disp:"OL",lamp:false,short:true,cls:"no",msg:"Kurzschluss! Ein Strommesser hat fast keinen Widerstand. Parallel zur Lampe schließt er die Quelle kurz: "+(r==="mA"?"Die Sicherung im Multimeter brennt durch.":"Das Netzgerät springt in die Strombegrenzung (C.C.).")};
    if(dl==="V DC")return {disp:"12.00 V",lamp:true,ok:true,cls:"ok",msg:"Richtig gemessen: 12,00 V."};
    if(dl==="V AC")return {disp:"0.00 V",lamp:true,cls:"no",msg:"Das ist der Bereich für Wechselspannung. Unser Netzgerät liefert Gleichspannung: V DC."};
    if(dl==="Ω")return {disp:"Err",lamp:true,cls:"no",msg:"Widerstand misst man nur ohne Spannung. So kann das Gerät Schaden nehmen."};
    return {disp:"0.00",lamp:true,cls:"no",msg:"Drehschalter und Buchse passen nicht zusammen."};
  }
  if(volt){if(dl==="V DC")return {disp:"12.00 V",lamp:false,cls:"no",msg:"Die Lampe bleibt dunkel. Ein Spannungsmesser hat einen riesigen Widerstand und lässt in Reihe fast keinen Strom durch."};
    return {disp:"0.00",lamp:false,cls:"no",msg:"Lampe dunkel, Anzeige unbrauchbar. Für die Stromstärke gehört die rote Leitung in eine Strombuchse."};}
  if(dl==="10A"&&r==="10A")return {disp:"0.10 A",lamp:true,ok:true,cls:"ok",msg:"Richtig gemessen: 0,10 A."};
  if(dl==="mA"&&r==="mA")return {disp:"100.0 mA",lamp:true,ok:true,cls:"ok",msg:"Richtig gemessen: 100,0 mA. Im kleineren Bereich siehst du mehr Stellen."};
  return {disp:"0.00",lamp:true,cls:"no",msg:"Drehschalter und Buchse passen nicht zusammen: Zu 10A gehört die Buchse 10A, zu mA die Buchse mA."};
}
page("fuehrerschein","ch","Multimeter-Führerschein",
'<div class="cols3"><div class="col"><div class="card"><svg id="mmC" viewBox="0 0 350 220" role="img" aria-label="Schaltplan mit Messgerät"></svg><b>Anschluss im Stromkreis</b><div class="row"><button id="cPar">parallel zur Lampe</button><button id="cSer">in Reihe</button></div><b>Welche Leitung steckst du?</b><div class="row"><button id="lRed" style="border-color:var(--i)">rote Leitung</button><button id="lBlk">schwarze Leitung</button></div></div></div>'+
'<svg id="mm" viewBox="0 0 240 400" width="250" role="img" aria-label="Multimeter mit Drehschalter und vier Buchsen"></svg>'+
'<div class="col"><div class="card"><div class="row"><h3 id="mmT" style="flex:1"></h3><span class="pill" id="mmP"></span></div><p id="mmD"></p><p class="sm muted">Drehschalter stellen, beide Leitungen stecken, Anschluss wählen. Dann erst einschalten.</p><div class="row"><button class="check" id="outBtn">OUTPUT ein</button><span class="pill" id="outS"></span></div><div class="fb" id="mmfb"></div><button id="mmN" class="primary" hidden>Nächster Auftrag</button></div>'+
'<p class="sm muted">Übungsgerät: ein typisches Schul-Multimeter. Euer echtes Gerät kann anders beschriftet sein, die Logik bleibt gleich.</p></div></div>',
function(){
  function stop(){fb($("mmfb"),"warn","Stopp: erst OUTPUT ausschalten, dann umbauen oder umschalten.");}
  function draw(){var done=S.mm>=3,t=TASK[Math.min(S.mm,2)],res=D.on?D.res:null;
    $("mmT").textContent=done?"Führerschein bestanden":t.t;$("mmD").textContent=done?"Alle drei Messungen sitzen. Hol dir das echte Multimeter. Hier kannst du weiter ausprobieren, was bei Fehlern passiert.":t.d;
    $("mmP").textContent=Math.min(S.mm,3)+" von 3";
    $("cPar").classList.toggle("sel",D.con==="par");$("cSer").classList.toggle("sel",D.con==="ser");$("lRed").classList.toggle("sel",D.lead==="red");$("lBlk").classList.toggle("sel",D.lead==="blk");
    $("outBtn").textContent=D.on?"OUTPUT aus":"OUTPUT ein";$("outS").textContent="Netzgerät 12.0 V, Ausgang "+(D.on?(res&&res.short?"ein, C.C.":"ein"):"aus");
    $("mm").innerHTML=mmSvg(D,res?res.disp:null);
    var letter=D.red&&D.red!=="VΩ"?"A":(D.red?"V":(D.con==="ser"?"A":"V"));
    $("mmC").innerHTML=circSvg(D.con,letter,res&&res.lamp&&!res.short,res&&res.lamp&&!res.short);
    function bind(sel,fn){$("mm").querySelectorAll(sel).forEach(function(g){var f=function(){if(D.on){stop();return;}fn(g.dataset.n);draw();};g.onclick=f;g.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}};});}
    bind(".dl",function(n){D.dial=n;});
    bind(".sk",function(n){if(D.lead==="red"){if(D.blk===n)D.blk=null;D.red=n;D.lead="blk";}else{if(D.red===n)D.red=null;D.blk=n;D.lead="red";}});}
  function guard(fn){return function(){if(D.on){stop();return;}fn();draw();};}
  $("cPar").onclick=guard(function(){D.con="par";});$("cSer").onclick=guard(function(){D.con="ser";});
  $("lRed").onclick=guard(function(){D.lead="red";});$("lBlk").onclick=guard(function(){D.lead="blk";});
  $("outBtn").onclick=function(){
    if(D.on){D.on=false;D.res=null;$("mmfb").textContent="";draw();return;}
    var r=evalMM();if(r.pre){fb($("mmfb"),"warn",r.msg);return;}
    D.res=r;D.on=true;var msg=r.msg,cls=r.cls,t=TASK[S.mm];
    if(r.ok&&S.mm<3){
      if(D.dial===t.dial&&D.red===t.red&&D.con===t.con){msg+=" Auftrag erfüllt. Schalte OUTPUT aus.";$("mmN").hidden=false;}
      else if(S.mm===1&&D.dial==="mA"){cls="warn";msg="Der Wert stimmt, aber du hast Regel 3 verletzt: Bei unbekannter Stromstärke beginnt man im größten Bereich. Miss im 10-A-Bereich.";}
      else{cls="warn";msg+=" Saubere Messung, aber nicht die Größe aus dem Auftrag.";}}
    fb($("mmfb"),cls,msg);draw();};
  $("mmN").onclick=function(){S.mm++;save();D.on=false;D.res=null;D.dial="OFF";D.red=D.blk=D.con=null;D.lead="red";this.hidden=true;$("mmfb").textContent="";draw();};
  draw();},
function(){return S.mm>=3;});

page("versuch","ex","Versuch: Messen an der Lampe",
'<div class="cols"><div class="col"><div class="card"><h3>Aufbau und Durchführung</h3><ol><li>Baut den Stromkreis: Netzgerät, Schalter, Lampe <b>12 V / 100 mA</b>.</li><li>OUTPUT ist aus. Stellt mit VOLTAGE <span class="U">12,0 V</span> ein. Die Strombegrenzung stellt eure Lehrkraft ein.</li><li>Aufbau kontrollieren lassen, dann OUTPUT ein.</li><li>Messt die <span class="U">Spannung an der Lampe</span>.</li><li>OUTPUT aus. Messt die <span class="I">Stromstärke an Stelle A</span>. Beginnt im 10-A-Bereich.</li><li>Wiederholt die Messung an <span class="I">Stelle B</span>.</li></ol></div>'+
'<div class="card"><svg viewBox="0 0 350 220" id="vC" role="img" aria-label="Schaltplan mit den Messstellen A und B" style="max-height:230px;margin:0 auto"></svg></div></div>'+
'<div class="col"><div class="card"><h3>Messprotokoll</h3><table><tr><td><label for="vU0">Spannung am Netzgerät</label></td><td><input id="vU0" type="text" inputmode="decimal"> V</td></tr><tr><td><label for="vUL" class="U">Spannung an der Lampe</label></td><td><input id="vUL" type="text" inputmode="decimal"> V</td></tr><tr><td><label for="vIA" class="I">Stromstärke an Stelle A</label></td><td><input id="vIA" type="text" inputmode="decimal"> mA</td></tr><tr><td><label for="vIB" class="I">Stromstärke an Stelle B</label></td><td><input id="vIB" type="text" inputmode="decimal"> mA</td></tr></table>'+
'<div class="row"><button class="check" id="vEval">Auswerten</button></div><div class="fb" id="vfb"></div></div>'+
'<div class="card" id="vq" hidden><label for="vQ"><b>Wie viel <span class="Q">Ladung</span> fließt bei eurer Stromstärke in 60 s durch die Lampe?</b></label><div class="row"><input id="vQ" type="text" inputmode="decimal"><span>C</span><button class="check" id="vQc">Prüfen</button></div><div class="fb" id="vqfb"></div></div></div></div>',
function(){
  $("vC").innerHTML=sym("source",40,120,90)+sym("lamp",260,120,90,{lit:true})+P("M40 90V50H260V90")+P("M40 150V190H260V150")+'<circle cx="150" cy="50" r="8" fill="var(--i)"/><text x="150" y="36" text-anchor="middle" font-size="18" font-family="Share Tech Mono, monospace" fill="var(--i)">A</text><circle cx="150" cy="190" r="8" fill="var(--i)"/><text x="150" y="214" text-anchor="middle" font-size="18" font-family="Share Tech Mono, monospace" fill="var(--i)">B</text><text class="sch-t" x="62" y="125" fill="var(--u)">12 V</text><text class="sch-t" x="282" y="114">12 V</text><text class="sch-t" x="282" y="132">100 mA</text>';
  ["vU0","vUL","vIA","vIB"].forEach(function(id){$(id).value=S.v[id]||"";$(id).oninput=function(){S.v[id]=this.value;save();};});
  $("vEval").onclick=function(){var U0=num(S.v.vU0),UL=num(S.v.vUL),IA=num(S.v.vIA),IB=num(S.v.vIB),f=$("vfb");
    if(U0==null||UL==null||IA==null||IB==null){fb(f,"warn","Tragt erst alle vier Messwerte ein.");return;}
    if(IA>0&&IA<2&&IB<2){fb(f,"warn","Eure Stromstärken sehen nach Ampere aus. Tragt sie in Milliampere ein: 0,10 A = 100 mA.");return;}
    var same=Math.abs(IA-IB)<=Math.max(5,IA*.05),txt;
    if(same){txt="Die Stromstärke ist vor und hinter der Lampe gleich ("+fmt(IA,0)+" mA und "+fmt(IB,0)+" mA). Strom wird nicht verbraucht: Die Lampe wandelt Energie um, die Ladung fließt vollständig weiter.";
      if(S.q.tip!=null)txt+=S.q.tip===1?" Tom hatte recht, und du auch.":" Tom hatte recht. Die Messung entscheidet.";}
    else txt="Eure Werte an A und B unterscheiden sich deutlich ("+fmt(IA,0)+" mA und "+fmt(IB,0)+" mA). Prüft Messbereich und Buchsen und messt noch einmal.";
    if(Math.abs(UL-U0)>1)txt+=" Auffällig: Die Spannung an der Lampe weicht um mehr als 1 V vom Netzgerät ab. Kontrolliert die Anschlüsse.";
    if(same&&(IA<70||IA>130))txt+=" Laut Aufdruck sollten bei 12 V etwa 100 mA fließen. Stimmt eure Spannung, und ist es die richtige Lampe?";
    fb(f,same?"ok":"no",txt);S.vOk=same;save();$("vq").hidden=!same;};
  $("vQc").onclick=function(){var x=num($("vQ").value),IA=num(S.v.vIA);if(x==null||IA==null){fb($("vqfb"),"warn","Gib eine Zahl ein.");return;}var Q=IA/1000*60;
    if(Math.abs(x-Q)<=Math.max(.1,Q*.03)){S.vqOk=true;save();fb($("vqfb"),"ok","Richtig: Q = I · t = "+fmt(IA/1000,3)+" A · 60 s = "+fmt(Q,1)+" C.");}
    else fb($("vqfb"),"no","Noch nicht. Rechne erst in Ampere um, dann Q = I · t.");};
  $("vq").hidden=!S.vOk;},
function(){return S.vOk;});

page("abschluss","ch","Auflösung und Exit-Ticket",
'<div class="cols"><div class="col"><div class="card"><h3>Zurück zur Powerbank</h3><p class="sm" id="pbyou"></p><div id="q-mah"></div><div id="pbSol" hidden><p class="sm">1 mAh = 1 mA · 1 h. <span class="I">Stromstärke</span> mal Zeit ergibt <span class="Q">Ladung</span>: Q = I · t. Die Powerbank speichert 10 000 mAh = 10 A · 3600 s = <span class="Q">36 000 C</span>.</p>'+
'<label for="e2"><b>Ein Akku mit 2000 mAh wird mit 0,5 A geladen. Wie lange dauert das?</b></label><div class="row"><input id="e2" type="text" inputmode="decimal"><span>h</span><button class="check" id="e2c">Prüfen</button></div><div class="fb" id="e2f"></div></div></div>'+
'<div class="card"><div class="row"><span class="big" id="score">0/4</span><div><b id="scoreT"></b><p class="sm muted">Zeig diesen Stand deiner Lehrkraft.</p></div></div><div class="row"><button class="small" id="reset">Alles zurücksetzen</button></div></div></div>'+
'<div class="col"><div class="card" id="exit" style="gap:12px"><h3>Exit-Ticket</h3></div></div></div>',
function(){
  quiz($("q-mah"),"mah","Jetzt kannst du es selbst sagen: Was gibt die Einheit mAh an?",["eine Stromstärke","eine Ladung","eine Spannung","eine Zeit"],1,"Milliampere mal Stunde ist Stromstärke mal Zeit, also eine Ladung.");
  function sol(){$("pbSol").hidden=S.q.mah!==1;}
  $("q-mah").addEventListener("click",function(){setTimeout(sol,0);});sol();
  if(S.ex.e2)fb($("e2f"),"ok","Gelöst: t = Q / I = 2000 mAh / 500 mA = 4 h.");
  $("e2c").onclick=function(){var x=num($("e2").value);if(x==null){fb($("e2f"),"warn","Gib eine Zahl ein.");return;}
    if(Math.abs(x-4)<=.05){S.ex.e2=true;save();fb($("e2f"),"ok","Richtig: t = Q / I = 2000 mAh / 500 mA = 4 h.");}else fb($("e2f"),"no","Noch nicht. Rechne 0,5 A in mA um und teile.");};
  [["x1","Wie wird ein Strommesser angeschlossen?",["parallel zum Bauteil","in Reihe mit dem Bauteil","an beide Pole der Quelle"],1,"Der ganze Strom muss durch das Messgerät fließen."],
   ["x2","Was beschreibt die Spannung?",["die Menge der Ladung","den Antrieb des Stroms","das Tempo der Elektronen"],1,"Ohne Spannung kein Strom."],
   ["x3","Die Stromstärke hinter der Lampe ist …",["kleiner als davor","gleich groß","größer als davor"],1,"Im unverzweigten Stromkreis ist sie überall gleich."],
   ["x4","In 2 s fließen 3 C. Wie groß ist I?",["6 A","1,5 A","0,67 A"],1,"I = Q / t = 3 C / 2 s = 1,5 A."]
  ].forEach(function(x){var d=document.createElement("div");$("exit").appendChild(d);quiz(d,x[0],x[1],x[2],x[3],x[4]);});
  $("reset").onclick=function(){if(this.dataset.arm){try{localStorage.removeItem(KEY);}catch(e){}location.hash="powerbank";location.reload();}else{this.dataset.arm="1";this.textContent="Wirklich alles löschen? Noch einmal tippen";}};},
function(){return S.q.mah===1&&S.q.x1===1&&S.q.x2===1&&S.q.x3===1&&S.q.x4===1;});

/* ================= Rahmen ================= */
function marks(){
  document.querySelectorAll("#dots a").forEach(function(a,i){var p=PAGES[i];a.classList.toggle("done",p.type!=="in"&&p.done());});
  var x=["x1","x2","x3","x4"].filter(function(k){return S.q[k]===1;}).length,ch=PAGES.filter(function(p){return p.type!=="in";}),dn=ch.filter(function(p){return p.done();}).length;
  if($("score")){$("score").textContent=x+"/4";$("scoreT").textContent="Exit-Ticket · "+dn+" von "+ch.length+" Challenges abgeschlossen";}
  if($("pbyou"))$("pbyou").textContent=S.verm.trim()?"Deine Vermutung vom Anfang: „"+S.verm.trim()+"“":"Am Anfang hast du keine Vermutung notiert.";
}
function curI(){var h=location.hash.replace("#","");for(var i=0;i<PAGES.length;i++)if(PAGES[i].id===h)return i;return 0;}
function show(){
  var i=curI();
  PAGES.forEach(function(p,k){p.el.classList.toggle("on",k===i);if(p.model){if(k===i)p.model.start();else p.model.stop();}});
  document.querySelectorAll("#dots a").forEach(function(a,k){if(k===i)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  $("pos").textContent="Seite "+(i+1)+" von "+PAGES.length+" · "+TYPE[PAGES[i].type];
  $("prev").style.visibility=i===0?"hidden":"visible";$("next").style.visibility=i===PAGES.length-1?"hidden":"visible";
  $("main").scrollTop=0;marks();
}
function go(d){var i=curI()+d;if(i>=0&&i<PAGES.length)location.hash=PAGES[i].id;}
function theme(){
  var t=S.theme||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
  $("theme").textContent=t==="dark"?"Hell":"Dunkel";$("theme").setAttribute("aria-label","Zum "+(t==="dark"?"hellen":"dunklen")+" Modus wechseln");
  return t;
}
function start(data){
  load();if(data&&data.S)S=data.S;
  var main=$("main"),dots="";
  PAGES.forEach(function(p,i){var s=document.createElement("section");s.className="page t-"+p.type;s.id="p-"+p.id;
    s.innerHTML='<div class="phead"><span class="tag">'+TYPE[p.type]+'</span><h2>'+p.title+'</h2></div>'+p.html;main.appendChild(s);p.el=s;
    dots+='<a class="t-'+p.type+'" href="#'+p.id+'" title="'+esc(p.title)+'" aria-label="Seite '+(i+1)+': '+esc(p.title)+'">'+(i+1)+'</a>';});
  $("dots").innerHTML=dots;
  PAGES.forEach(function(p){if(p.init)p.init.call(p);});
  /* Erklärtexte auf Input-Seiten: einzeln antippen oder alle auf einmal verdecken */
  var XP=[],XB=[];
  function cover(el,c){el.classList.toggle("cov",c);el.setAttribute("aria-expanded",c?"false":"true");}
  function coverAll(c){S.verdeckt=c;XP.forEach(function(el){cover(el,c);});XB.forEach(function(b){b.textContent=c?"Alle Texte zeigen":"Texte verdecken";});save();}
  PAGES.forEach(function(p){if(p.type!=="in")return;
    p.el.querySelectorAll(".merk,.card").forEach(function(el){if(el.querySelector("button,input,canvas,svg,.card,.merk"))return;
      el.classList.add("xp");el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","Erklärtext ein- oder ausblenden");
      var t=function(){cover(el,!el.classList.contains("cov"));};el.addEventListener("click",t);el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});XP.push(el);});
    var b=document.createElement("button");b.className="small";b.onclick=function(){coverAll(!S.verdeckt);};p.el.querySelector(".phead").appendChild(b);XB.push(b);});
  coverAll(!!S.verdeckt);
  $("prev").onclick=function(){go(-1);};$("next").onclick=function(){go(1);};
  $("theme").onclick=function(){S.theme=theme()==="dark"?"light":"dark";save();theme();};
  theme();window.addEventListener("hashchange",show);show();
  try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {S:S};});}catch(e){}
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start({});
})();
</script>
